[nitpick.styles]
include = [
    "../../autowalrus.toml",
    "../../autoflake.toml",
    "../mypy/mypy.toml",
]

[[".pre-commit-config.yaml".repos]]
repo = "https://github.com/ikamensh/flynt"
hooks = [{ id = "flynt" }]

[[".pre-commit-config.yaml".repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
hooks = [{ id = "ruff-check", args = ["--fix"], types_or = ["python", "pyi", "pyproject"] }, { id = "ruff-format" }]

["pyproject.toml".tool.ruff]
line-length = 80

["pyproject.toml".tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

["pyproject.toml".tool.ruff.lint.isort]
split-on-trailing-comma = false

["pyproject.toml".tool.flynt]
transform-concats = true
transform-joins = true
line-length = 120
aggressive = true

["pyproject.toml".tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--doctest-modules"]
filterwarnings = ["error"]

["pyproject.toml".tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

["pyproject.toml".tool.coverage.run]
branch = true
relative_files = true
